<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f2e">
  <title>Sky Princess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/prenses.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="sky"></canvas>

  <!-- WELCOME: only the princess greets the player; a tap opens the map -->
  <section id="screen-home" class="screen welcome">
    <div class="home-hero">
      <div class="princess-home" id="princess-home"></div>
      <h1 class="logo"><span class="logo-small">The</span><span>Sky Princess</span></h1>
      <p class="tap-hint" data-i18n="tapToBegin">Tap to begin</p>
    </div>
  </section>

  <!-- KINGDOM MAP -->
  <section id="screen-map" class="screen" hidden>
    <div class="top-bar">
      <div class="lives-pill" data-lives><span class="heart">❤</span><b class="lives-count">5</b><span class="lives-timer"></span></div>
      <button class="coin-pill" id="btn-coins" aria-label="Coins, open shop"><span class="coin"></span><b id="coin-count">0</b><span class="plus">+</span></button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" data-i18n-aria="settings">⚙</button>
    </div>
    <button class="festival-banner" id="festival-banner" hidden>
      <span class="fest-star">✦</span>
      <span class="fest-text"><b id="fest-title">Star Festival</b><small id="fest-sub"></small></span>
      <span class="fest-bar"><i id="fest-fill"></i></span>
    </button>
    <div class="map-atmos" aria-hidden="true">
      <div class="moonbeam"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="windows" id="map-windows"></div>
    </div>
    <div class="map-scroll" id="map-scroll">
      <div class="map-path" id="level-grid"></div>
    </div>
    <div class="map-dock">
      <button class="dock-btn" id="btn-daily" aria-label="Daily gift" data-i18n-aria="dailyTitle">
        <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="giftG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9cc0"/><stop offset="1" stop-color="#b02e5c"/></linearGradient><linearGradient id="ribG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset="1" stop-color="#c58a26"/></linearGradient></defs>
          <rect x="6" y="16" width="28" height="20" rx="3" fill="url(#giftG)"/><rect x="4" y="11" width="32" height="8" rx="2" fill="url(#giftG)" stroke="#ffd0e0" stroke-width=".8"/>
          <rect x="17.5" y="11" width="5" height="25" fill="url(#ribG)"/><path d="M20 11c-4-7-11-6-9-1 1 2 6 2 9 1zm0 0c4-7 11-6 9-1-1 2-6 2-9 1z" fill="url(#ribG)"/></svg>
        <span data-i18n="daily">Daily</span><i class="dot" id="daily-dot" hidden></i>
      </button>
      <button class="dock-btn" id="btn-quests" aria-label="Quests" data-i18n-aria="questsTitle">
        <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="scrollG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d1"/><stop offset="1" stop-color="#d9b46a"/></linearGradient></defs>
          <path d="M9 7h20a4 4 0 0 1 4 4v20a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V11" fill="url(#scrollG)" stroke="url(#ribG)" stroke-width="1.5"/><path d="M5 10a3 3 0 0 1 6 0v3H5z" fill="#c58a26"/>
          <path d="M13 15l1.6 1.6L18 13M13 22l1.6 1.6L18 20" stroke="#2fa36b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 15h8M20 22h8M14 28h14" stroke="#8a6a2e" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span data-i18n="quests">Quests</span><i class="dot" id="quests-dot" hidden></i>
      </button>
      <button class="dock-btn" id="btn-shop" aria-label="Shop" data-i18n-aria="shopTitle">
        <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="chestG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f97ff"/><stop offset="1" stop-color="#22359a"/></linearGradient></defs>
          <path d="M5 18a15 9 0 0 1 30 0v3H5z" fill="url(#chestG)" stroke="url(#ribG)" stroke-width="2"/><rect x="5" y="21" width="30" height="14" rx="2" fill="url(#chestG)" stroke="url(#ribG)" stroke-width="2"/>
          <rect x="17" y="18" width="6" height="8" rx="1.5" fill="url(#ribG)"/><circle cx="20" cy="22" r="1.2" fill="#22359a"/><path d="M12 13l1 2 2 .5-2 .5-1 2-1-2-2-.5 2-.5zM29 10l.8 1.6 1.6.4-1.6.4-.8 1.6-.8-1.6-1.6-.4 1.6-.4z" fill="#fff6d8"/></svg>
        <span data-i18n="shop">Shop</span>
      </button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen" hidden>
    <div class="hud">
      <button class="icon-btn" id="btn-quit" aria-label="Leave level" data-i18n-aria="leaveTitle">✕</button>
      <div class="hud-level"><span data-i18n="level">Level</span> <b id="hud-level">1</b></div>
      <div class="hud-moves"><b id="hud-moves">25</b><small data-i18n="moves">moves</small></div>
    </div>
    <div class="stage">
      <div class="princess-stage" id="princess-stage"></div>
      <div class="stage-side">
        <div class="stage-tools">
          <button class="booster" id="btn-wand" aria-label="Royal Wand" data-i18n-aria="item_wand"><canvas width="96" height="96"></canvas><b class="count" id="wand-count">0</b></button>
        </div>
        <div class="speech" id="speech" hidden><span id="speech-text">Amazing!</span></div>
        <div class="hud-score">
          <div class="score-line"><span id="hud-score">0</span><span class="goals" id="hud-goals"></span></div>
          <div class="progress"><div class="progress-fill" id="hud-progress"></div>
            <span class="pstar" data-star="1">★</span><span class="pstar" data-star="2">★</span><span class="pstar" data-star="3">★</span>
          </div>
        </div>
      </div>
    </div>
    <div class="board-wrap"><div class="board-frame ornate"><canvas id="board"></canvas></div></div>
  </section>

  <!-- CHAPTER STORY -->
  <div class="story" id="story" hidden>
    <div class="story-inner">
      <small class="story-chapter" id="story-chapter">Chapter 1 complete</small>
      <div class="princess-story" id="princess-story"></div>
      <p class="story-text" id="story-text"></p>
      <div class="story-reward" id="story-reward"></div>
      <button class="btn btn-primary" id="story-next" data-i18n="continue">Continue</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal ornate">
      <div class="modal-scroll">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-buttons" id="modal-buttons"></div>
      </div>
    </div>
  </div>

  <!-- Placeholder ad for browser testing -->
  <div class="mock-ad" id="mock-ad" hidden>
    <div class="mock-ad-kind"></div>
    <div class="mock-ad-box"><span data-i18n="adSpace">AD SPACE</span><br><small data-i18n="adHere">On Android, an AdMob ad appears here</small></div>
    <div class="mock-ad-timer">3</div>
    <button class="btn btn-secondary mock-ad-close" hidden data-i18n="close">Close</button>
  </div>

  <script src="js/main.js" type="module"></script>
</body>
</html>
