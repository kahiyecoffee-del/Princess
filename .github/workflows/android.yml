# Google Play'e yüklenecek .aab dosyasını GitHub sunucularında derler.
# Bilgisayar gerekmez. GitHub kotasını korumak için yalnızca elle çalışır:
# Actions → "Android derlemesi" → Run workflow (veya Claude'a "Android derlemesini başlat" deyin).
# Gerekli gizli anahtarlar (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      : yükleme anahtarı (.jks) dosyasının base64 hali
#   KEYSTORE_PASSWORD    : anahtarın şifresi
# İsteğe bağlı değişken (Variables sekmesi):
#   ADMOB_APP_ID         : kendi AdMob uygulama kimliğiniz (ca-app-pub-...~...)
name: Android derlemesi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Bağımlılıklar ve testler
        run: |
          npm ci
          npm test
          npx cap sync android

      - name: Yükleme anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 eklenmemiş: imzasız derlenecek, Play'e yüklenemez. README'deki 'Telefondan yayınlama' adımlarına bakın."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: İmzalı AAB derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/gokyuzu-prensesi-${{ github.run_number }}.aab"

      - name: Sürüm (Release) olarak yayınla
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "gokyuzu-prensesi-${{ github.run_number }}.aab" \
            --title "Derleme ${{ github.run_number }} (sürüm kodu ${{ github.run_number }})" \
            --notes "Google Play Console'a yüklenecek dosya: gokyuzu-prensesi-${{ github.run_number }}.aab"

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
