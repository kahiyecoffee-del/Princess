<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f2e">
  <title>Sky Princess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/prenses.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="sky"></canvas>

  <!-- WELCOME: only the princess greets the player; a tap opens the map -->
  <section id="screen-home" class="screen welcome">
    <div class="home-hero">
      <div class="princess-home" id="princess-home"></div>
      <h1 class="logo"><span class="logo-small">The</span><span>Sky Princess</span></h1>
      <p class="tap-hint">Tap to begin</p>
    </div>
  </section>

  <!-- KINGDOM MAP -->
  <section id="screen-map" class="screen" hidden>
    <div class="top-bar">
      <div class="lives-pill" data-lives><span class="heart">❤</span><b class="lives-count">5</b><span class="lives-timer"></span></div>
      <h2>Kingdom Map</h2>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙</button>
    </div>
    <div class="map-scroll" id="map-scroll">
      <div class="map-path" id="level-grid"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen" hidden>
    <div class="hud">
      <button class="icon-btn" id="btn-quit" aria-label="Leave level">✕</button>
      <div class="hud-level">Level <b id="hud-level">1</b></div>
      <div class="hud-moves"><b id="hud-moves">25</b><small>moves</small></div>
    </div>
    <div class="stage">
      <div class="princess-stage" id="princess-stage"></div>
      <div class="stage-side">
        <div class="speech" id="speech" hidden><span id="speech-text">Amazing!</span></div>
        <div class="hud-score">
          <div class="score-line"><span id="hud-score">0</span><span class="goals" id="hud-goals"></span></div>
          <div class="progress"><div class="progress-fill" id="hud-progress"></div>
            <span class="pstar" data-star="1">★</span><span class="pstar" data-star="2">★</span><span class="pstar" data-star="3">★</span>
          </div>
        </div>
      </div>
    </div>
    <div class="board-wrap"><div class="board-frame ornate"><canvas id="board"></canvas></div></div>
  </section>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal ornate">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-buttons" id="modal-buttons"></div>
    </div>
  </div>

  <!-- Placeholder ad for browser testing -->
  <div class="mock-ad" id="mock-ad" hidden>
    <div class="mock-ad-kind"></div>
    <div class="mock-ad-box">AD SPACE<br><small>On Android, an AdMob ad appears here</small></div>
    <div class="mock-ad-timer">3</div>
    <button class="btn btn-secondary mock-ad-close" hidden>Close ✕</button>
  </div>

  <script src="js/main.js" type="module"></script>
</body>
</html>
